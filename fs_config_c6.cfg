#
# CB-C6 自定义文件属性（fs_config）
#
# 为什么需要这个文件：
#   system.img 里的文件模式不是由安装时的权限决定的，而是由 fs_config 表统一覆盖
#   （build/make 生成镜像时 --fs_config）。/system/app/** 默认是 0644，
#   即使源码目录里是 0755、暂存目录 out/.../system/app/... 也是 0755，
#   进镜像后仍会变成 0644。
#
#   Iconify 的 libaapt.so / libaapt2.so / libzipalign.so 实质是 aarch64 可执行文件
#   （PIE），应用会把它们 symlink 到自己的 bin/ 下 execve，必须有执行位。
#   配合 device/phh/treble/sepolicy/iconify.te 里的 iconify_exec 类型使用。
#

[system/app/Iconify/lib/arm64/libaapt.so]
mode: 0755
user: root
group: root
caps: 0

[system/app/Iconify/lib/arm64/libaapt2.so]
mode: 0755
user: root
group: root
caps: 0

[system/app/Iconify/lib/arm64/libzipalign.so]
mode: 0755
user: root
group: root
caps: 0
